<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - {{ config.APP_NAME }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/main.css') }}" rel="stylesheet">
</head>
<body class="login-page">

<div class="login-box">
  <div class="text-center mb-4">
    <i class="bi bi-shield-lock" style="font-size:48px; color:#667eea;"></i>
    <h3 class="mt-2">MOKONDO</h3>
    <h6 class="mt-2">Dashboard Online</h6>
  </div>

  {% include 'components/flash.html' %}

  <form method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input name="username" class="form-control form-control-lg" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input name="password" type="password" class="form-control form-control-lg" required>
    </div>
    <button class="btn btn-primary btn-lg w-100">
      <i class="bi bi-box-arrow-in-right"></i> Masuk
    </button>
  </form>

  <p class="text-center text-muted mt-3 small">
    {{ config.APP_NAME }}
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
